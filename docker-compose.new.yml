version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ff-domination-db
    environment:
      POSTGRES_USER: ffuser
      POSTGRES_PASSWORD: ffpass
      POSTGRES_DB: ff_domination
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ff-domination-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ff-domination-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ffuser:ffpass@postgres:5432/ff_domination
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: ff-domination-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Celery Worker (for background tasks)
  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ff-domination-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://ffuser:ffpass@postgres:5432/ff_domination
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app
    command: celery -A app.worker worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
